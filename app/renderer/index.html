<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MiraQuota</title>
<style>
  :root {
    --bg: #16181d; --card: #1f2229; --card-hi: #262a33;
    --fg: #e8eaf0; --fg-dim: rgba(232,234,240,.55); --fg-faint: rgba(232,234,240,.34);
    --accent: #4c8dff; --ok: #3fb96e; --warn: #e0a63c; --bad: #e05c5c;
    --track: rgba(255,255,255,.09); --line: rgba(255,255,255,.07);
    --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f3f6; --card: #ffffff; --card-hi: #f6f7fa;
      --fg: #1b1d23; --fg-dim: rgba(27,29,35,.55); --fg-faint: rgba(27,29,35,.36);
      --track: rgba(0,0,0,.08); --line: rgba(0,0,0,.07);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); overflow: hidden;
    font: 13px/1.45 "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none;
  }

  /* ---- 自绘标题栏 ---- */
  .titlebar {
    height: 40px; display: flex; align-items: center; gap: 8px;
    padding: 0 6px 0 14px; -webkit-app-region: drag;
  }
  .titlebar .logo { width: 16px; height: 16px; }
  .titlebar .name { font-weight: 600; font-size: 13px; letter-spacing: .2px; }
  .badge {
    font-size: 10.5px; padding: 2px 8px; border-radius: 99px; font-weight: 600;
    background: rgba(63,185,110,.14); color: var(--ok);
  }
  .badge.stale, .badge.reckoned { background: rgba(224,166,60,.15); color: var(--warn); }
  .badge.local, .badge.connecting { background: rgba(224,92,92,.14); color: var(--bad); }
  .titlebar .sp { flex: 1; }
  .tbtn {
    -webkit-app-region: no-drag; width: 34px; height: 28px; border: 0; border-radius: 7px;
    background: transparent; color: var(--fg-dim); font-size: 13px; cursor: pointer;
  }
  .tbtn:hover { background: var(--track); color: var(--fg); }

  /* ---- 内容 ---- */
  .scroll { height: calc(100% - 40px); overflow-y: auto; padding: 6px 14px 14px; }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--track); border-radius: 4px; }

  .detail {
    font-size: 11.5px; color: var(--warn); background: rgba(224,166,60,.09);
    border-radius: 8px; padding: 7px 10px; margin-bottom: 10px; line-height: 1.5;
  }
  .detail:empty { display: none; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 10px;
  }
  .card .head { display: flex; align-items: baseline; gap: 8px; }
  .card .label { font-size: 12.5px; color: var(--fg-dim); font-weight: 600; }
  .card .money { margin-left: auto; font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .card .full { font-size: 12px; color: var(--fg-faint); font-weight: 500; }
  .card .pct {
    font-size: 12px; font-weight: 700; color: var(--accent);
    background: rgba(76,141,255,.13); padding: 1px 8px; border-radius: 99px; margin-left: 8px;
  }
  .bar { position: relative; height: 6px; border-radius: 3px; background: var(--track); margin: 10px 0 8px; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--accent); min-width: 2px; }
  .bar .fill.hot { background: var(--warn); }
  .bar .pace { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg-faint); border-radius: 1px; }
  .row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--fg-dim); margin-top: 3px; }
  .row .r { color: var(--fg-faint); }

  .speed .head .label { color: var(--fg-dim); }
  .speed table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .speed td { padding: 3px 0; font-size: 11.5px; color: var(--fg-dim); }
  .speed td.m { font-weight: 600; color: var(--fg); white-space: nowrap; padding-right: 10px; }
  .speed td.t { text-align: right; color: var(--fg-faint); white-space: nowrap; }
  .speed .drift-up { color: var(--ok); }
  .speed .drift-down { color: var(--bad); }
  .inflight { font-size: 11.5px; color: var(--accent); margin-top: 6px; }
  .inflight .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); margin-right: 6px; animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .3; } }

  .foot { font-size: 11px; color: var(--fg-faint); line-height: 1.7; padding: 2px 2px 0; }
  .foot b { color: var(--fg-dim); font-weight: 600; }
  .empty { text-align: center; color: var(--fg-faint); padding: 48px 0 32px; font-size: 12.5px; }

  .exhaust table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .exhaust td { padding: 3px 0; font-size: 11.5px; color: var(--fg-dim); }
  .exhaust td.m { font-weight: 600; color: var(--fg); white-space: nowrap; padding-right: 10px; }
  .exhaust td.t { text-align: right; color: var(--fg-faint); white-space: nowrap; }
  .exhaust .hint { font-size: 10.5px; color: var(--fg-faint); margin-top: 6px; line-height: 1.5; }
  .exhaust input {
    width: 44px; font: inherit; color: var(--fg); background: var(--card-hi);
    border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px; text-align: center;
  }
</style>
</head>
<body>
  <div class="titlebar">
    <svg class="logo" viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="none" stroke="#464c5a" stroke-width="6"/><path id="logoArc" d="" fill="none" stroke="#4c8dff" stroke-width="6" stroke-linecap="round"/></svg>
    <span class="name">MiraQuota</span>
    <span class="badge" id="state">连接中</span>
    <span class="sp"></span>
    <button class="tbtn" id="btnMin" title="最小化">–</button>
    <button class="tbtn" id="btnHide" title="收到托盘">✕</button>
  </div>
  <div class="scroll">
    <div class="detail" id="detail"></div>
    <div id="cards"><div class="empty">正在读取额度……</div></div>
    <div class="card exhaust" id="exhaustCard" style="display:none">
      <div class="head"><span class="label">耗尽预演</span><span class="sp" style="flex:1"></span>
        <span class="label">每天用 <input id="hoursIn" type="number" min="0.5" max="24" step="0.5" value="8"> 小时</span></div>
      <table id="exhaustRows"></table>
      <div class="hint">「均速」照最近几天的整体节奏外推（空闲摊薄在内）；「每天 N 小时」按每活跃小时的实测点数消耗推演。超过重置时间即到期耗不尽。</div>
    </div>
    <div class="card speed" id="speedCard" style="display:none">
      <div class="head"><span class="label">速度</span><span class="sp" style="flex:1"></span><span class="label" id="speedNote"></span></div>
      <table id="speedRows"></table>
      <div class="inflight" id="inflight" style="display:none"></div>
    </div>
    <div class="foot" id="foot"></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  $('btnMin').onclick = () => window.miraquota.minimize();
  $('btnHide').onclick = () => window.miraquota.hide();

  const WINDOW_NAME = { '5h': '5 小时', '7d': '7 天', '7d_fable': '7 天 · Fable' };
  const CONF = { none: '无样本', low: '标定中', medium: '收敛中', high: '高置信' };
  const money = (v, digits = 1) => '$' + Number(v).toFixed(digits);

  function fmtReset(t) {
    if (t == null) return '';
    const left = Math.max(0, t - Date.now() / 1000);
    if (left >= 86400) return `重置 ${(left / 86400).toFixed(1)} 天`;
    const h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60), s = Math.floor(left % 60);
    return `重置 ${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }
  const ago = (sec) => {
    const d = Math.max(0, Date.now() / 1000 - sec);
    if (d < 90) return `${Math.round(d)} 秒前`;
    if (d < 5400) return `${Math.round(d / 60)} 分钟前`;
    return `${(d / 3600).toFixed(1)} 小时前`;
  };

  // 标题栏 logo 弧线随 5h 用量走
  function drawArc(pct) {
    const a = Math.max(0.02, Math.min(1, pct / 100)) * Math.PI * 2;
    const r = 11, cx = 16, cy = 16;
    const x = cx + r * Math.sin(a), y = cy - r * Math.cos(a);
    $('logoArc').setAttribute('d', `M ${cx} ${cy - r} A ${r} ${r} 0 ${a > Math.PI ? 1 : 0} 1 ${x} ${y}`);
  }

  function windowCard(w) {
    const name = WINDOW_NAME[w.label] ?? w.label;
    const mark = w.inferred ? '≈' : '';
    const main = w.scaledSpentUSD ?? (w.fullUSD != null ? w.spentUSD : null);
    const mainText = main != null ? money(main) : (w.points ? `${Math.round(w.points.used)} 点` : '—');
    const fullText = w.fullUSD != null ? ` / ${mark}${money(w.fullUSD, 0)}` : ' / 标定中';
    const hot = w.paceDelta != null && w.paceDelta > 0;
    const eta = w.etaSeconds != null
      ? (w.resetAt != null && w.etaSeconds > w.resetAt - Date.now() / 1000 ? '到重置不满' : `≈${(w.etaSeconds / 86400 >= 1 ? (w.etaSeconds / 86400).toFixed(1) + ' 天' : (w.etaSeconds / 3600).toFixed(1) + ' 小时')}后打满`)
      : '';
    const ledgerBits = [money(w.spentUSD ?? 0)];
    if (w.points) ledgerBits.push(`${Math.round(w.points.used)}/${fmtK(w.points.budget)} 点`);
    return `<div class="card">
      <div class="head">
        <span class="label">${name}</span>
        <span class="money" title="已用美元 = 满额 × 点数百分比（${w.usedPercent.toFixed(1)}%）；满额由回归标定：对每对「Δ本机账本$ ÷ Δ已用点数」求和反推（${w.sampleCount ?? 0} 组观测，${CONF[w.confidence] ?? ''}）">${mark}${mainText}<span class="full">${fullText}</span></span>
        <span class="pct">${mark}${w.usedPercent.toFixed(1)}%</span>
      </div>
      <div class="bar">
        <div class="fill${hot ? ' hot' : ''}" style="width:${Math.min(100, w.usedPercent)}%"></div>
        ${w.pacePercent != null ? `<div class="pace" style="left:${Math.min(100, w.pacePercent)}%"></div>` : ''}
      </div>
      <div class="row">
        <span>${w.remainingUSD != null ? '余 ' + mark + money(w.remainingUSD, 0) : ''}${eta ? ' · ' + eta : ''}</span>
        <span class="r">${fmtReset(w.resetAt)}</span>
      </div>
      <div class="row">
        <span>账本 ${ledgerBits.join(' · ')}</span>
        <span class="r">${w.paceDelta != null ? '均速 ' + (w.paceDelta >= 0 ? '+' : '') + w.paceDelta.toFixed(1) + '%' : ''} ${CONF[w.confidence] ?? ''}</span>
      </div>
    </div>`;
  }
  const fmtK = (n) => n >= 10000 ? Math.round(n / 1000) + 'k' : String(Math.round(n));

  // ---- 耗尽预演 ----
  const HOURS_KEY = 'miraquota.hoursPerDay';
  function hoursPerDay() {
    const v = parseFloat($('hoursIn').value);
    return Number.isFinite(v) && v > 0 ? Math.min(24, v) : 8;
  }
  try { const saved = parseFloat(localStorage.getItem(HOURS_KEY)); if (Number.isFinite(saved) && saved > 0) $('hoursIn').value = saved; } catch {}
  $('hoursIn').addEventListener('input', () => {
    try { localStorage.setItem(HOURS_KEY, String(hoursPerDay())); } catch {}
    if (latest) render(latest);
  });

  const fmtDur = (sec) => sec >= 86400 ? `${(sec / 86400).toFixed(1)} 天` : `${(sec / 3600).toFixed(1)} 小时`;

  function exhaustRow(w) {
    const e = w.exhaust;
    if (!e || !w.points) return '';
    const untilReset = w.resetAt != null ? w.resetAt - Date.now() / 1000 : null;
    const cap = (sec) => untilReset != null && sec > untilReset ? '到期耗不尽' : `≈${fmtDur(sec)}`;
    const avg = e.avgSeconds != null ? cap(e.avgSeconds) : '—';
    let custom = '—';
    if (e.perActiveHourPoints > 0) {
      const remainDays = (w.points.budget - w.points.used) / (e.perActiveHourPoints * hoursPerDay());
      custom = cap(remainDays * 86400);
    }
    return `<tr>
      <td class="m">${WINDOW_NAME[w.label] ?? w.label}</td>
      <td>均速 ${avg}</td>
      <td>每天 ${hoursPerDay()}h ${custom}</td>
      <td class="t">${e.activeHours != null ? '已活跃 ' + e.activeHours.toFixed(1) + 'h' : ''}</td>
    </tr>`;
  }

  function render(p) {
    if (!p) return;
    const st = $('state');
    st.textContent = p.stateLabel ?? '—';
    st.className = 'badge ' + (p.state ?? '');
    $('detail').textContent = p.detail ?? '';

    const ws = p.windows ?? [];
    $('cards').innerHTML = ws.length ? ws.map(windowCard).join('') : '<div class="empty">暂无额度数据</div>';
    drawArc(ws.find((w) => w.label === '5h')?.usedPercent ?? 0);

    const exRows = ws.map(exhaustRow).filter(Boolean);
    $('exhaustCard').style.display = exRows.length ? '' : 'none';
    $('exhaustRows').innerHTML = exRows.join('');

    const sp = p.speed;
    const hasRows = sp && sp.rows && sp.rows.length;
    const hasInflight = sp && sp.inflightSince && sp.inflightSince.length;
    $('speedCard').style.display = hasRows || hasInflight ? '' : 'none';
    if (hasRows) {
      $('speedNote').textContent = `最近 ${sp.recentCount} 次`;
      $('speedRows').innerHTML = sp.rows.map((r) => {
        const drift = r.driftNotable != null
          ? `<span class="${r.driftNotable >= 0 ? 'drift-up' : 'drift-down'}">${r.driftNotable >= 0 ? '+' : ''}${r.driftNotable.toFixed(0)}%</span>` : '';
        return `<tr>
          <td class="m">${r.model}</td>
          <td>${r.ttft != null ? '首 ≈' + r.ttft.toFixed(1) + 's' : ''} ${r.rate != null ? '· ' + r.rate.toFixed(0) + ' tok/s' : '· 端到端 ' + r.endToEnd.toFixed(0) + ' tok/s'} ${drift}</td>
          <td class="t">${ago(r.latestAt)}</td>
        </tr>`;
      }).join('');
    } else { $('speedRows').innerHTML = ''; }
    $('inflight').style.display = hasInflight ? '' : 'none';
    if (hasInflight) {
      const oldest = Math.min(...sp.inflightSince);
      $('inflight').innerHTML = `<span class="dot"></span>生成中 ${sp.inflightSince.length} 条 · 最长已 ${Math.round(Date.now() / 1000 - oldest)} 秒`;
    }

    const bits = [];
    if (p.unitPriceUSD != null) {
      const c = p.unitPriceCalc;
      let t = `<b>单价</b> ${p.unitPriceUSD.toFixed(6)} $/点`;
      if (c) t += ` ＝ ${WINDOW_NAME[c.label] ?? c.label}窗本机账本 ${money(c.usd)} ÷ 同期已用 ${Math.round(c.points)} 点`;
      if (p.unitPriceSpread != null) t += `（5h/7d 跨窗校验离散 ${p.unitPriceSpread.toFixed(2)}×，>4× 停用美元）`;
      bits.push(t);
    }
    if (p.unitPriceNotice) bits.push(`<b>单价</b> ${p.unitPriceNotice}`);
    if (p.accountNotice) bits.push(`<b>账号</b> ${p.accountNotice}`);
    bits.push(`<b>账本</b> ${p.buckets ?? 0} 分钟桶 · ${p.pricing ?? '-'}`);
    bits.push(`<b>美元</b> 按官方 API 价折算的等价估值，非订阅账单；点数/百分比为账号权威口径。本机并发多会话已全量计入账本；其他设备的用量只体现在点数、不入本机账本，会拉低单价`);
    bits.push(`<b>采集</b> ${ago(p.capturedAt)}`);
    $('foot').innerHTML = bits.join('　');
  }

  let latest = null;
  window.miraquota.onQuota((p) => { latest = p; render(p); });
  window.miraquota.get().then((p) => { latest = p; render(p); });
  // 倒计时与「N 秒前」每秒走动，数据本身由主进程心跳推送。
  setInterval(() => { if (latest) render(latest); }, 1000);
</script>
</body>
</html>
