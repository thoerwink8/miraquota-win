name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  win:
    runs-on: windows-latest
    steps:
      # 全量历史：版本补丁位 = git rev-list --count，浅克隆会恒为 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # CI 环境下 electron-builder 默认尝试发 GitHub Release，产物走 Artifacts 分发，禁掉
      - run: pnpm run dist --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: MiraQuota-win-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
